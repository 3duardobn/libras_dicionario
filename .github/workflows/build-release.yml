name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ hashFiles('libras_dictionary/deps.edn') }}
          restore-keys: clojure-

      - name: Get Flutter dependencies
        working-directory: libras_dictionary
        run: flutter pub get

      - name: Compile ClojureDart → Dart
        working-directory: libras_dictionary
        run: clj -M:cljd compile

      - name: Build APK
        working-directory: libras_dictionary
        run: flutter build apk --release --split-per-abi

      - name: Stage release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          for apk in libras_dictionary/build/app/outputs/flutter-apk/app-*-release.apk; do
            arch=$(basename "$apk" | sed 's/app-\(.*\)-release.apk/\1/')
            cp "$apk" "libras_dicionario-${VERSION}-${arch}.apk"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: libras_dicionario-${{ github.ref_name }}-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
