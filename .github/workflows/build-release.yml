name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: libras_dictionary
        run: flutter pub get

      - name: Build APK
        working-directory: libras_dictionary
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp libras_dictionary/build/app/outputs/flutter-apk/app-release.apk \
             libras_dicionario-${VERSION}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: libras_dicionario-${{ github.ref_name }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
