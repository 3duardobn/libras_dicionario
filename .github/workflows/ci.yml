name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: libras_dictionary
        run: flutter pub get

      - name: Analyze
        working-directory: libras_dictionary
        run: flutter analyze

      - name: Test
        working-directory: libras_dictionary
        run: flutter test